name: Bug Report
description: Create a report to help us reproduce and fix a bug in altyazi-tr
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **PRIVACY NOTICE**: Do NOT attach or upload private recordings, confidential audio/video files, or sensitive transcripts. Reproduce any issue using synthetic test phrases or generated dummy files.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or command line used to reproduce the issue.
      placeholder: |
        1. Run command: `altyazi-tr sample.mp4 ...`
        2. See error output:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: terminal-output
    attributes:
      label: Terminal Output / Traceback
      description: Paste relevant terminal output or error messages (ensure no personal data or sensitive transcripts are included).
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Operating system and version (e.g. Ubuntu 24.04, Windows 11, macOS 14)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Run `python --version` (e.g. 3.10.12, 3.12.3)
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: altyazi-tr Version
      description: Run `altyazi-tr --version` (e.g. 0.1.0)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
