<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 484" width="820" height="484" role="img" aria-label="altyazi-tr CLI demo">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="818" height="482" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- Window Header / Title Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 809 1 A 10 10 0 0 1 819 11 L 819 40 L 1 40 Z" fill="#161b22"/>
  <line x1="1" y1="40" x2="819" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls (3 dots: Red, Yellow, Green) -->
  <circle cx="20" cy="20" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="38" cy="20" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="56" cy="20" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Centered Window Title -->
  <text x="410" y="24" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">altyazi-tr — terminal</text>

  <!-- Monospace Terminal Lines -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
  <text x="24" y="68"><tspan fill="#3fb950" font-weight="bold">$ </tspan><tspan fill="#f0f6fc" font-weight="bold">altyazi-tr </tspan><tspan fill="#79c0ff">--help</tspan></text>
  <text x="24" y="88"><tspan fill="#ff7b72" font-weight="bold">usage: </tspan><tspan fill="#c9d1d9"> altyazi-tr [-h] [-o OUTPUT] [--format {srt,vtt,ass,all}]</tspan></text>
  <text x="24" y="108"><tspan fill="#8b949e">                  [--model MODEL] [--mode {words,groups}]</tspan></text>
  <text x="24" y="128"><tspan fill="#8b949e">                  [--max-chars MAX_CHARS] [--max-lines MAX_LINES]</tspan></text>
  <text x="24" y="148"><tspan fill="#8b949e">                  [--pause-threshold PAUSE_THRESHOLD]</tspan></text>
  <text x="24" y="168"><tspan fill="#8b949e">                  [--burn] [--upper] [--report {json}] [input]</tspan></text>
  <text x="24" y="208"><tspan fill="#a5d6ff" font-weight="500">Create offline, word-timed subtitles from local media.</tspan></text>
  <text x="24" y="248"><tspan fill="#d2a8ff" font-weight="bold">options:</tspan></text>
  <text x="24" y="268"><tspan fill="#79c0ff" font-weight="500">  -h, --help</tspan><tspan fill="#8b949e">   show this help message and exit</tspan></text>
  <text x="24" y="288"><tspan fill="#79c0ff" font-weight="500">  -o, --output OUTPUT</tspan><tspan fill="#8b949e">   Output filename or stem (default: input stem)</tspan></text>
  <text x="24" y="308"><tspan fill="#79c0ff" font-weight="500">  --format {srt,vtt,ass,all}</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="328"><tspan fill="#79c0ff" font-weight="500">  --model MODEL</tspan><tspan fill="#8b949e">   Cached model name or local model directory</tspan></text>
  <text x="24" y="348"><tspan fill="#79c0ff" font-weight="500">  --mode {words,groups}</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="368"><tspan fill="#79c0ff" font-weight="500">  --upper</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="388"><tspan fill="#79c0ff" font-weight="500">  --burn</tspan><tspan fill="#8b949e">   Also create &lt;stem&gt;.burned.mp4</tspan></text>
  <text x="24" y="408"><tspan fill="#79c0ff" font-weight="500">  --style STYLE</tspan><tspan fill="#8b949e">   ASS style JSON or YAML</tspan></text>
  <text x="24" y="428"><tspan fill="#79c0ff" font-weight="500">  --report {json}</tspan><tspan fill="#8b949e">   Write &lt;stem&gt;.report.json</tspan></text>
  <text x="24" y="448"><tspan fill="#79c0ff" font-weight="500">  --words-json WORDS_JSON</tspan><tspan fill="#8b949e"></tspan></text>
  </g>
</svg>
